<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no">
    <title>BUAT BALI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
</head>

<body id="bodi">
    <!-- HALAMAN PERTAMA -->
    <div class="borders" style="text-align: center;" id="tembok1">
        <div class="card">
            <div class="img"> <span></span><span></span><span></span><span></span></div>
            <div class="content">
                <h2>HAI KEPET</h2>
                <h4>Kamu lagi ngapain?</h4>
            </div>
        </div>
        <br><br>
        <!-- Ditambahkan fungsi ganti halaman langsung pada onclick jika openFullscreen() bermasalah -->
        <button onclick="bukaHadiah(); openFullscreen();" class="tombols">Tekan buat lihat hadiah</button>
    </div>

    <!-- HALAMAN KEDUA -->
    <div class="borders" id="tembok2" style="display: none;">
        <h1 class="wafanisa --debug">
            <span class="wafanisa__row"><span class="wafanisa__text">SELAMAT MENIKMATI</span></span>
            <span class="wafanisa__row wafanisa__row--sibling" aria-hidden="true"><span class="wafanisa__text">SELAMAT MENIKMATI </span></span>
            <span class="wafanisa__row wafanisa__row--sibling" aria-hidden="true"><span class="wafanisa__text"> SELAMAT MENIKMATI</span></span>
            <span class="wafanisa__row wafanisa__row--sibling" aria-hidden="true"><span class="wafanisa__text">SELAMAT MENIKMATI</span></span>
            <span class="wafanisa__row wafanisa__row--sibling" aria-hidden="true"><span class="wafanisa__text">SELAMAT MENIKMATI</span></span>
            <span class="wafanisa__row wafanisa__row--sibling" aria-hidden="true"><span class="wafanisa__text">SELAMAT MENIKMATI</span></span>
        </h1>
        <h1 class="ml1">
            <span class="text-wrapper">
                <span class="line line1"></span>
                <span class="letters">SPESIAL FOR U</span>
                <span class="line line2"></span>
            </span>
        </h1>
        <br>
        <div class="kontener">
            <p id="tekss" style="font-size: 18px;"></p>
        </div>
    </div>

    <!-- AUDIO PEMUTAR BERULANG -->
    <audio id="mySound" src="love.mp3" loop controls style="display: none;"></audio>

    <script src="script.js"></script>
    <script src="salju.js"></script>

    <!-- JAVASCRIPT TAMBAHAN UNTUK FIX HP -->
    <script>
        // 1. Fungsi transisi halaman aman untuk HP dan memutar musik otomatis saat tombol ditekan
        function bukaHadiah() {
            document.getElementById('tembok1').style.display = 'none';
            document.getElementById('tembok2').style.display = 'block';
            
            // Putar lagu otomatis setelah user berinteraksi klik tombol
            const audio = document.getElementById('mySound');
            if(audio) {
                audio.play().catch(function(error) {
                    console.log("Musik diblokir browser: " + error);
                });
            }
        }

        // 2. Fungsi Fullscreen cadangan agar tidak error jika browser HP memblokir fiturnya
        function openFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); } 
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } 
            else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
        }

        // 3. Efek ketukan jari khusus untuk animasi .card di HP
        const card = document.querySelector('.card');
        if(card) {
            card.addEventListener('click', function() {
                this.classList.toggle('active');
            });
        }
    </script>
</body>

</html>
